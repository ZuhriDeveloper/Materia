name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  build-push-deploy:
    name: Build, Push & Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image owner (Docker requires lowercase names)
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webapi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.webapi
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/materia-webapi:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/materia-webapi:${{ github.sha }}

      - name: Build and push webui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.webui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/materia-webui:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/materia-webui:${{ github.sha }}

      - name: Debug — can the runner reach the VPS?
        run: |
          echo "Testing TCP from GitHub runner to 145.79.10.227:22 ..."
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/145.79.10.227/22' 2>/dev/null; then
            echo "RESULT: ✅ runner CAN reach 145.79.10.227:22  ->  problem is the VPS_HOST secret value"
          else
            echo "RESULT: ❌ runner CANNOT reach 145.79.10.227:22  ->  VPS firewall is blocking GitHub IPs"
          fi

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: /opt/materia
          strip_components: 1

      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/materia
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
