# =============================================================================
# Materia — Nginx reverse-proxy server blocks (REFERENCE / OPTIONAL)
# =============================================================================
# The repo's default production stack uses Caddy (see deploy/Caddyfile), which
# handles TLS + WebSockets automatically. Use THIS file ONLY if you front the
# VPS with Nginx instead of (or in front of) Caddy.
#
# IMPORTANT — why blazor.web.js 404s behind a misconfigured Nginx:
#   The Blazor Web App serves blazor.web.js and ALL fingerprinted assets from the
#   app itself via MapStaticAssets at paths like /_framework/* and /_content/*.
#   A common mistake is treating the app like a static SPA — pointing `root` at a
#   folder and using `try_files`, or only `proxy_pass`-ing a few `location`s. Then
#   /_framework/blazor.web.js misses the filesystem and Nginx returns its own 404.
#   The fix is to blindly reverse-proxy EVERY path to the container. Do not add a
#   `root` or `try_files` for the app domain.
#
# Wiring: Nginx must be able to reach the containers. Either publish the app port
#   on the host (e.g. add `ports: ["127.0.0.1:8080:8080"]` to the webui service and
#   `127.0.0.1:8081:8080` to webapi in docker-compose.prod.yml) and proxy_pass to
#   127.0.0.1, or run Nginx inside the same Docker network and proxy_pass to the
#   service names (webui:8080 / webapi:8080). The upstreams below assume the former.
# =============================================================================

# Maps the incoming Upgrade header to the Connection header value the backend needs.
# "" (no upgrade) -> "close"; "websocket" -> "upgrade". Required for the SignalR
# circuit used by Blazor Interactive Server (the /_blazor WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream materia_webui { server 127.0.0.1:8080; }
upstream materia_webapi { server 127.0.0.1:8081; }

# ---- HTTP -> HTTPS redirect (edge) -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com api.yourdomain.com;
    # Let your ACME client (certbot/acme.sh) keep serving challenges if needed:
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- Web UI (Blazor Web App, Interactive Server) ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # Blazor can push large component diffs / file uploads over the wire.
    client_max_body_size 50m;

    # ONE catch-all location. Everything — pages, /_framework/blazor.web.js, the
    # fingerprinted /_content/* and *.styles.css, AND the /_blazor WebSocket — is
    # proxied to the app. No `root`, no `try_files`.
    location / {
        proxy_pass http://materia_webui;

        # WebSocket upgrade for the SignalR circuit (Blazor Interactive Server).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve the original host + scheme so the app's UseForwardedHeaders sees
        # https and the public hostname (drives Secure cookies, redirects, abs URLs).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Don't buffer: keeps the SignalR stream flowing and avoids breaking the
        # interactive circuit. Long read timeout so an idle circuit isn't killed.
        proxy_buffering    off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}

# ---- Web API ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://materia_webapi;

        # Harmless to keep upgrade support here too (in case of future SSE/WS endpoints).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering    off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
