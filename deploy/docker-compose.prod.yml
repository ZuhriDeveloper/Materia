# Materia app stack — pure application services only.
#
# Reverse proxy (Caddy/TLS) and auto-deploy (Watchtower) now live in the shared EDGE stack
# (see the `vps-infra` repo: edge/docker-compose.yml). This stack no longer publishes any
# ports; the edge Caddy reaches webui/webapi by their network aliases on the external `edge`
# network. Renovin reaches Materia's API by the `webapi` alias on the external `materia-shared`
# network (server-to-server, internal, no TLS).
#
# Create the shared networks once on the VPS (idempotent, done by vps-infra/scripts/bootstrap.sh):
#   docker network create edge
#   docker network create materia-shared

services:

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: materiadb
      POSTGRES_USER: materia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - materia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materia -d materiadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - materia-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapi:
    image: ${GHCR_PREFIX}/materia-webapi:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__materiadb: Host=postgres;Port=5432;Database=materiadb;Username=materia;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: Materia.WebApi
      Jwt__Audience: Materia.WebUi
      WebUi__BaseUrl: https://${APP_DOMAIN}
      # ── Voyage AI (embeddings for semantic product search) ──────────────
      Voyage__ApiKey: ${VOYAGE_API_KEY}
      # ── Email (Brevo SMTP) ──────────────────────────────────────────────
      # FromAddress must be a sender/domain you've verified in Brevo, or mail
      # is rejected. Secrets (login/key) live in .env, never in this file.
      Email__Host: smtp-relay.brevo.com
      Email__Port: "587"
      Email__UseStartTls: "true"
      Email__User: ${BREVO_SMTP_LOGIN}
      Email__Password: ${BREVO_SMTP_KEY}
      Email__FromAddress: ${MAIL_FROM_ADDRESS}
      Email__FromName: Materia POS
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      materia-net:
      # Reached by the edge Caddy for the public api.<domain> vhost.
      edge:
        aliases: [materia-webapi]
      # Reached by Renovin's apiservice for /api/catalog/semantic-search (internal, no TLS).
      materia-shared:
        aliases: [webapi]

  webui:
    image: ${GHCR_PREFIX}/materia-webui:latest
    restart: unless-stopped
    depends_on:
      - webapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Forwarded-header handling lives in Program.cs (UseForwardedHeaders). Do not set
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED here — it would register the middleware twice.
      ApiService__BaseUrl: https://${API_DOMAIN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      materia-net:
      # Reached by the edge Caddy for the public app.<domain> vhost.
      edge:
        aliases: [materia-webui]

volumes:
  postgres_data:
  redis_data:

networks:
  # Private to this stack: postgres, redis, webapi, webui talk here.
  materia-net:
    driver: bridge
  # Shared public bus owned by the edge stack (Caddy). Create once: docker network create edge
  edge:
    external: true
  # Private bridge between Materia's webapi and Renovin's apiservice.
  # Create once: docker network create materia-shared
  materia-shared:
    external: true
