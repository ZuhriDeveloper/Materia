services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: materiadb
      POSTGRES_USER: materia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - materia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materia -d materiadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - materia-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapi:
    image: ${GHCR_PREFIX}/materia-webapi:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__materiadb: Host=postgres;Port=5432;Database=materiadb;Username=materia;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: Materia.WebApi
      Jwt__Audience: Materia.WebUi
      WebUi__BaseUrl: https://${APP_DOMAIN}
      # ── Email (Brevo SMTP) ──────────────────────────────────────────────
      # FromAddress must be a sender/domain you've verified in Brevo, or mail
      # is rejected. Secrets (login/key) live in .env, never in this file.
      Email__Host: smtp-relay.brevo.com
      Email__Port: "587"
      Email__UseStartTls: "true"
      Email__User: ${BREVO_SMTP_LOGIN}
      Email__Password: ${BREVO_SMTP_KEY}
      Email__FromAddress: ${MAIL_FROM_ADDRESS}
      Email__FromName: Materia POS
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - materia-net
      - edge   # reachable by the shared edge-proxy Caddy (see ../../edge-proxy)

  webui:
    image: ${GHCR_PREFIX}/materia-webui:latest
    restart: unless-stopped
    depends_on:
      - webapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Forwarded-header handling lives in Program.cs (UseForwardedHeaders). Do not set
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED here — it would register the middleware twice.
      ApiService__BaseUrl: https://${API_DOMAIN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - materia-net
      - edge   # reachable by the shared edge-proxy Caddy (see ../../edge-proxy)

  # NOTE: The reverse proxy (Caddy) was moved OUT of this stack into the neutral shared
  # `edge-proxy` stack (see ../../edge-proxy) so it no longer belongs to Materia. webui/webapi
  # above join the `edge` network so that shared Caddy can reach them by service name.

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    # Pull-based auto-deploy: polls GHCR and recreates the labeled app
    # containers (webapi/webui) whenever CI pushes a new image. Outbound only —
    # no inbound access to the VPS is needed, so the firewall block is irrelevant.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuses the `docker login ghcr.io` you ran on the VPS so Watchtower can
      # pull your PRIVATE images. Must match the user you logged in as:
      #   logged in as 'deploy' -> keep the line below
      #   logged in as root     -> change to /root/.docker/config.json
      #   images are PUBLIC     -> delete the line below
      - /home/deploy/.docker/config.json:/config.json:ro
    environment:
      # The watchtower image defaults to an old Docker API version (1.25) that
      # modern Docker daemons reject — pin a supported one.
      DOCKER_API_VERSION: "1.41"
      WATCHTOWER_CLEANUP: "true"          # remove old images after updating
      WATCHTOWER_LABEL_ENABLE: "true"     # only watch containers we labeled
      WATCHTOWER_POLL_INTERVAL: "120"     # check GHCR every 120 seconds
      WATCHTOWER_ROLLING_RESTART: "true"  # update one container at a time
    networks:
      - materia-net

volumes:
  postgres_data:
  redis_data:
  # caddy_data/caddy_config removed: the reverse proxy now lives in the shared edge-proxy stack.

networks:
  materia-net:
    driver: bridge
  # Shared edge network so the neutral edge-proxy Caddy (and the Renovin/Aghnia stacks) can
  # reach webui/webapi by service name. Create once on the VPS:  docker network create edge
  edge:
    external: true
